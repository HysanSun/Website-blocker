<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --bg-page: #eef1f5;
            --border-color: #ecf0f1;
            --text-muted: #95a5a6;
            --radius-sm: 8px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-page);
            color: var(--primary-color);
            margin: 0;
            padding: 16px;
        }

        .container { max-width: 430px; margin: 0 auto; }

        .card {
            background: #fff;
            border-radius: var(--radius-md);
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 0 0 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Timer --- */
        .phase-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        #cycle-dots { letter-spacing: 3px; color: var(--accent-color); font-size: 0.8rem; }
        #clock {
            font-size: 3.6rem;
            font-weight: 700;
            color: var(--accent-color);
            text-align: center;
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
        }
        #clock.on-break { color: var(--success-color); }
        #task-line {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            min-height: 1.2em;
            margin-bottom: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-row { display: flex; gap: 8px; }
        .btn-row button {
            flex: 1;
            padding: 9px 0;
            border-radius: var(--radius-sm);
            border: 1px solid #ddd;
            background: #fff;
            color: var(--primary-color);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-row button:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .btn-row button.primary {
            background: var(--success-color);
            border-color: var(--success-color);
            color: #fff;
        }
        .btn-row button.primary:hover { opacity: 0.9; color: #fff; }
        .btn-row button:disabled { opacity: 0.4; cursor: default; border-color: #ddd; color: var(--primary-color); }
        #today-line {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 10px;
        }
        #notify-hint {
            margin-top: 10px;
            padding: 7px 9px;
            background: #fef3e4;
            border: 1px solid #f3d5ae;
            border-radius: var(--radius-sm);
            font-size: 0.68rem;
            color: #8a5a1a;
        }

        /* --- Tasks --- */
        .add-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .add-row input {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
        }
        .add-row input:focus { outline: none; border-color: var(--accent-color); }
        .add-row button {
            padding: 8px 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--success-color);
            color: #fff;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .task {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.82rem;
        }
        .task:last-child { border-bottom: none; }
        .task.active {
            background: #fef3e4;
            border-radius: var(--radius-sm);
            padding-left: 6px;
            padding-right: 6px;
        }
        .task input[type="checkbox"] { flex-shrink: 0; cursor: pointer; }
        .task .text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .task .meta { font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
        .task button {
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.68rem;
            padding: 2px 6px;
            line-height: 1.3;
            flex-shrink: 0;
        }
        .task button:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .task button.play:hover { background: var(--success-color); border-color: var(--success-color); color: #fff; }
        .task button:disabled { opacity: 0.3; cursor: default; }
        .task input.edit {
            flex: 1;
            min-width: 0;
            font-size: 0.82rem;
            padding: 3px 6px;
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            font-family: inherit;
        }
        .empty { font-size: 0.76rem; color: var(--text-muted); padding: 6px 0; }
        #clear-done {
            margin-top: 10px;
            padding: 6px 12px;
            font-size: 0.72rem;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: var(--radius-sm);
            color: var(--danger-color);
            cursor: pointer;
        }
        #clear-done:hover { border-color: var(--danger-color); }

        /* --- Settings --- */
        #settings-toggle { cursor: pointer; }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px 10px;
            align-items: center;
            font-size: 0.78rem;
        }
        .settings-grid input[type="number"] {
            width: 72px;
            padding: 5px 7px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.78rem;
            font-family: inherit;
        }
        .settings-grid label.check {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        #save-settings {
            margin-top: 12px;
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent-color);
            color: #fff;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .hint { font-size: 0.68rem; color: var(--text-muted); margin: 8px 0 0; }
    </style>
</head>
<body>

<div class="container">

    <!-- Timer -->
    <div class="card">
        <div class="phase-row">
            <span id="phase-label">Idle</span>
            <span id="cycle-dots"></span>
        </div>
        <div id="clock">25:00</div>
        <div id="task-line"></div>
        <div class="btn-row">
            <button id="primary-btn" class="primary">Start</button>
            <button id="skip-btn">Skip</button>
            <button id="stop-btn">Stop</button>
        </div>
        <div id="today-line"></div>
        <div id="notify-hint" hidden>System notifications are off: Chrome has not granted the permission. Reload the extension on chrome://extensions and accept it.</div>
    </div>

    <!-- Tasks -->
    <div class="card">
        <h2>Tasks</h2>
        <div class="add-row">
            <input type="text" id="task-input" placeholder="What are you working on?" maxlength="200">
            <button id="task-add">Add</button>
        </div>
        <div id="task-list"></div>
    </div>

    <!-- Done -->
    <div class="card">
        <h2>Done</h2>
        <div id="done-list"></div>
        <button id="clear-done">Clear completed</button>
    </div>

    <!-- Settings -->
    <div class="card">
        <h2 id="settings-toggle">Timer settings <span id="settings-caret">&#9662;</span></h2>
        <div id="settings-panel" hidden>
            <div class="settings-grid">
                <label for="s-focus">Focus (min)</label>
                <input type="number" id="s-focus" min="1" max="180" step="1">

                <label for="s-short">Short break (min)</label>
                <input type="number" id="s-short" min="1" max="60" step="1">

                <label for="s-long">Long break (min)</label>
                <input type="number" id="s-long" min="1" max="120" step="1">

                <label for="s-cycles">Focuses per long break</label>
                <input type="number" id="s-cycles" min="1" max="12" step="1">

                <label class="check"><input type="checkbox" id="s-autobreak"> Start breaks automatically</label>
                <label class="check"><input type="checkbox" id="s-autofocus"> Start the next focus automatically</label>
                <label class="check"><input type="checkbox" id="s-strict"> Block timed sites during focus</label>
            </div>
            <button id="save-settings">Save settings</button>
            <p class="hint">Changes apply from the next session. A running timer keeps the deadline it started with.</p>
        </div>
    </div>

</div>

<script src="pomodoro.js"></script>
</body>
</html>
